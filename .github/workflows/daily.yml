name: Daily AI Bio Brief

on:
  schedule:
    # 北京时间 7:30 和 18:30
    - cron: '30 23 * * *'   # 北京时间 07:30
    - cron: '30 10 * * *'   # 北京时间 18:30
  workflow_dispatch:        # 允许手动点击运行

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install twscrape httpx

      - name: Run the script
        env:
          X_COOKIES: ${{ secrets.X_COOKIES }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python main.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/ || true
          git diff --staged --quiet || git commit -m "Update brief $(date +'%Y-%m-%d %H:%M')"
          git push
